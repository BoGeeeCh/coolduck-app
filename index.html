<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const currentUserHandle = tg.initDataUnsafe?.user?.username || '';
    const currentUserId = tg.initDataUnsafe?.user?.id || Date.now();
    
    let myBalance = parseInt(localStorage.getItem('dealduck_balance')) || 300;
    let myNickname = localStorage.getItem('dealduck_nick') || '';
    let showOnlyFriendsInLB = false;
    let lamboOwnerId = null;
    let forcedColor = null;

    // Начальный глобальный список (заполняется локально или с сервера)
    let users = JSON.parse(localStorage.getItem('dealduck_global_users')) || [];

    function getDefaultSectors() {
      let sectors = [];
      for(let i=0; i<5; i++) sectors.push({ color: '#1A1A1A', multiplier: 2 });
      for(let i=0; i<5; i++) sectors.push({ color: '#E74C3C', multiplier: 2 });
      for(let i=0; i<3; i++) sectors.push({ color: '#2ECC71', multiplier: 3 });
      for(let i=0; i<2; i++) sectors.push({ color: '#F1C40F', multiplier: 5 });
      return sectors;
    }

    let mySectors = getDefaultSectors();

    function ensureSelfInUsers() {
      let me = users.find(u => u.username && u.username.toLowerCase() === currentUserHandle.toLowerCase());
      if (me) {
        me.coins = myBalance;
        if (myNickname) me.name = myNickname;
      } else if (currentUserHandle || myNickname) {
        users.push({
          id: currentUserId,
          name: myNickname || currentUserHandle || 'Игрок',
          username: currentUserHandle,
          coins: myBalance,
          isFriend: true,
          sectors: getDefaultSectors()
        });
      }
      saveUsers();
    }

    if (currentUserHandle.toLowerCase() === 'blabad') {
      document.getElementById('adminNavBtn').style.display = 'flex';
    }

    if (myNickname) {
      document.getElementById('regModal').style.display = 'none';
      ensureSelfInUsers();
    }

    function registerUser() {
      const input = document.getElementById('nicknameInput').value.trim();
      if (!input) return alert("Введите корректный никнейм!");
      
      myNickname = input;
      localStorage.setItem('dealduck_nick', myNickname);
      document.getElementById('regModal').style.display = 'none';
      
      ensureSelfInUsers();

      // Отправляем данные о регистрации на сервер
      tg.sendData(JSON.stringify({
        action: 'register',
        nickname: myNickname,
        username: currentUserHandle
      }));
    }

    function saveBalance() {
      localStorage.setItem('dealduck_balance', myBalance);
      let me = users.find(u => u.username && u.username.toLowerCase() === currentUserHandle.toLowerCase());
      if (me) me.coins = myBalance;
      saveUsers();
    }

    function saveUsers() {
      localStorage.setItem('dealduck_global_users', JSON.stringify(users));
    }

    function updateBalanceUI() {
      document.querySelectorAll('.balanceVal').forEach(el => el.innerText = myBalance);
      saveBalance();
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');
      event.currentTarget.classList.add('active');

      if(tab === 'friends') renderFriendsOnly();
      if(tab === 'all-users') renderAllUsers();
      if(tab === 'leaderboard') renderLeaderboard();
      if(tab === 'editor') renderEditor();
    }

    function renderFriendsOnly() {
      const container = document.getElementById('friendsOnlyList');
      container.innerHTML = '';
      const friends = users.filter(u => u.isFriend);

      if(friends.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:gray;">У вас пока нет друзей. Добавьте их во вкладке "Все".</div>';
        return;
      }

      friends.forEach(u => {
        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = `
          <span style="font-weight:bold; cursor:pointer;" onclick="openRouletteModal(${u.id})">🎯 ${u.name}</span>
          <button class="btn-primary" style="font-size:11px; padding:6px 10px; width:auto;" onclick="sendMyRoulette('${u.name}', true)">Отправить свою</button>
        `;
        container.appendChild(item);
      });
    }

    function renderAllUsers() {
      const container = document.getElementById('allUsersList');
      container.innerHTML = '';
      
      if(users.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:gray;">Список пользователей пуст.</div>';
        return;
      }

      const isAdmin = currentUserHandle.toLowerCase() === 'blabad';

      users.forEach((u) => {
        const item = document.createElement('div');
        item.className = 'list-item';
        
        const deleteButtonHtml = isAdmin 
          ? `<button style="background:#FF3B30; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:12px;" onclick="deleteUser(${u.id})">✕</button>` 
          : '';

        item.innerHTML = `
          <span>${u.name} (${u.username ? '@'+u.username : 'нет юзернейма'})</span>
          <div style="display: flex; align-items: center; gap: 10px;">
            <label style="font-size:12px; cursor:pointer;">
              <input type="checkbox" ${u.isFriend ? 'checked' : ''} onchange="toggleFriend(${u.id})"> В друзья
            </label>
            ${deleteButtonHtml}
          </div>
        `;
        container.appendChild(item);
      });
    }

    function toggleFriend(id) {
      const u = users.find(x => x.id === id);
      if(u) {
        u.isFriend = !u.isFriend;
        saveUsers();
      }
    }

    function deleteUser(id) {
      if(currentUserHandle.toLowerCase() !== 'blabad') {
        return alert("У вас нет прав администратора!");
      }
      
      if(confirm("Вы уверены, что хотите удалить этого пользователя из топа?")) {
        users = users.filter(u => u.id !== id);
        saveUsers();
        renderAllUsers();
        renderLeaderboard();
      }
    }

    function buyLambo() {
      if(myBalance < 25000) return alert("Недостаточно DealDuck_coin! Нужно 25 000.");
      myBalance -= 25000;
      updateBalanceUI();

      if(!lamboOwnerId) {
        lamboOwnerId = currentUserHandle;
        alert("🎉 ПОЗДРАВЛЯЕМ! Вы ПЕРВЫЙ владелец Lamborghini!");
      } else {
        alert("Вы купили Lamborghini!");
      }
    }

    function toggleLeaderboardFilter() {
      showOnlyFriendsInLB = !showOnlyFriendsInLB;
      document.getElementById('lbFilterBtn').innerText = showOnlyFriendsInLB ? "Показывать: Только друзья" : "Показывать: Все люди";
      renderLeaderboard();
    }

    function renderLeaderboard() {
      ensureSelfInUsers();
      const container = document.getElementById('leaderboardList');
      container.innerHTML = '';
      
      let filtered = showOnlyFriendsInLB ? users.filter(u => u.isFriend) : [...users];
      filtered.sort((a,b) => b.coins - a.coins);

      filtered.forEach((u, i) => {
        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = `
          <div>
            <b>#${i+1} ${u.name}</b> ${u.username === currentUserHandle ? '(Вы)' : ''}
            ${lamboOwnerId === u.username ? '<span class="badge-lambo">🥇 1-й Lambo</span>' : ''}
          </div>
          <span style="color:var(--gold-color); font-weight:bold;">${u.coins} 🪙</span>
        `;
        container.appendChild(item);
      });
    }

    function renderEditor() {
      const container = document.getElementById('editorSectors');
      container.innerHTML = '';
      mySectors.forEach((s, i) => {
        container.innerHTML += `
          <div class="sector-row">
            <input type="color" value="${s.color}" onchange="mySectors[${i}].color=this.value">
            <span style="font-size:12px;">Множитель:</span>
            <input type="number" value="${s.multiplier}" min="2" style="width:50px; padding:4px; border-radius:4px;" onchange="validateMultiplier(this, ${i})">
            <button style="background:#FF3B30; color:#fff; border:none; padding:4px 8px; border-radius:4px;" onclick="removeSector(${i})">✕</button>
          </div>`;
      });
    }

    function validateMultiplier(input, index) {
      let val = parseFloat(input.value);
      if(isNaN(val) || val < 2) {
        alert("Минимальный множитель выигрыша равен x2!");
        val = 2;
        input.value = 2;
      }
      mySectors[index].multiplier = val;
    }

    function addSector() {
      mySectors.push({ color: '#9B59B6', multiplier: 2 });
      renderEditor();
    }

    function removeSector(i) {
      if(mySectors.length <= 2) return alert("Должно быть минимум 2 сектора!");
      mySectors.splice(i, 1);
      renderEditor();
    }

    // --- АДМИН-ФУНКЦИИ ---
    function adminSetCoins() {
      const user = document.getElementById('adminUserTarget').value.trim();
      const coins = parseInt(document.getElementById('adminCoinAmount').value);

      if(!user || isNaN(coins)) return alert("Заполните корректно юзернейм и баланс!");

      const cleanUser = user.replace('@', '').toLowerCase();
      let targetObj = users.find(u => u.username && u.username.toLowerCase() === cleanUser);
      
      if(targetObj) {
        targetObj.coins = coins;
        if(cleanUser === currentUserHandle.toLowerCase()) {
          myBalance = coins;
          updateBalanceUI();
        }
        saveUsers();
        alert(`Баланс пользователя @${cleanUser} изменён на ${coins} коинов!`);
      } else {
        users.push({ id: Date.now(), name: user, username: cleanUser, coins: coins, isFriend: true, sectors: getDefaultSectors() });
        saveUsers();
        alert(`Пользователь @${cleanUser} добавлен в топ с балансом ${coins}!`);
      }

      tg.sendData(JSON.stringify({
        action: 'admin_set_coins',
        target_username: cleanUser,
        new_coins: coins
      }));
    }

    function adminRigRoulette() {
      const color = document.getElementById('adminRiggedColor').value;
      forcedColor = color;
      
      tg.sendData(JSON.stringify({
        action: 'admin_rig_roulette',
        rigged_color: color
      }));

      alert(`🎯 Шанс 100% успешно установлен для цвета: ${color}!`);
    }

    function sendMyRoulette(targetName, isFriend) {
      const payload = {
        action: 'send_roulette',
        sender_name: myNickname || 'Игрок',
        target: targetName,
        is_friend: isFriend,
        sectors: mySectors
      };

      tg.sendData(JSON.stringify(payload));
      alert(`Рулетка отправлена пользователю ${targetName}!`);
    }

    let activeSectors = [];
    let currentAngle = 0;

    function openRouletteModal(userId) {
      const friend = users.find(u => u.id === userId);
      if(!friend) return;
      activeSectors = friend.sectors || getDefaultSectors();
      document.getElementById('modalTitle').innerText = `Рулетка: ${friend.name}`;
      document.getElementById('rouletteModal').style.display = 'flex';
      
      const select = document.getElementById('colorSelect');
      select.innerHTML = '';
      activeSectors.forEach((s, idx) => {
        select.innerHTML += `<option value="${idx}">Сектор ${idx+1} (${s.color}) x${s.multiplier}</option>`;
      });

      drawCanvas();
    }

    function closeModal() { document.getElementById('rouletteModal').style.display = 'none'; }

    function drawCanvas() {
      const canvas = document.getElementById('rouletteCanvas');
      const ctx = canvas.getContext('2d');
      const arc = (2 * Math.PI) / activeSectors.length;

      ctx.clearRect(0, 0, 220, 220);
      activeSectors.forEach((s, i) => {
        const angle = currentAngle + i * arc;
        ctx.beginPath();
        ctx.fillStyle = s.color;
        ctx.moveTo(110, 110);
        ctx.arc(110, 110, 110, angle, angle + arc);
        ctx.fill();

        ctx.save();
        ctx.translate(110, 110);
        ctx.rotate(angle + arc / 2);
        ctx.fillStyle = '#FFF';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText(`x${s.multiplier}`, 80, 4);
        ctx.restore();
      });
    }

    function spinRoulette() {
      const bet = parseInt(document.getElementById('betInput').value);
      if(bet > myBalance || isNaN(bet) || bet <= 0) return alert("Недостаточно коинов!");

      myBalance -= bet;
      updateBalanceUI();

      let spins = 5;
      let totalRot;

      if (forcedColor) {
        const targetIndex = activeSectors.findIndex(s => s.color.toUpperCase() === forcedColor.toUpperCase());
        const arc = (2 * Math.PI) / activeSectors.length;
        if (targetIndex !== -1) {
          totalRot = spins * Math.PI * 2 + (1.5 * Math.PI - (targetIndex * arc + arc/2));
        } else {
          totalRot = spins * Math.PI * 2 + Math.random() * Math.PI * 2;
        }
      } else {
        totalRot = spins * Math.PI * 2 + Math.random() * Math.PI * 2;
      }

      let start = null;

      function anim(t) {
        if(!start) start = t;
        let progress = (t - start) / 3000;
        if(progress < 1) {
          currentAngle = totalRot * (1 - Math.pow(1 - progress, 3));
          drawCanvas();
          requestAnimationFrame(anim);
        } else {
          alert("Вращение завершено!");
          forcedColor = null;
        }
      }
      requestAnimationFrame(anim);
    }

    updateBalanceUI();
  </script>
